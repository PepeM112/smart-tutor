services:
  backend:
    build: ./backend
    container_name: plearner-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=${NEON_DB_DEV}

  frontend:
    build: ./frontend
    container_name: plearner-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules overwrites container
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/
    depends_on:
      - backend