services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smarttutor-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: smarttutor
      POSTGRES_PASSWORD: smarttutor
      POSTGRES_DB: smarttutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttutor"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
